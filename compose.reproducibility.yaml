# Deliberately independent of compose.yaml: no fixed container names, host ports,
# existing volumes, .env files, credentials, or production database URLs.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: isolated-test-only
    volumes:
      - verification_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U research -d research"]
      interval: 2s
      timeout: 3s
      retries: 30
  ingestion-api:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    environment:
      DATABASE_URL: postgresql://research:isolated-test-only@postgres:5432/research
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://research:isolated-test-only@postgres:5432/research
      FRAMEWORK_RESEARCH_DB_READS: "true"
      PORT: 8080
    depends_on:
      ingestion-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/framework-popularity').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 10s
      retries: 30
  verifier:
    profiles: [verification]
    build:
      context: .
      dockerfile: Dockerfile.reproducibility
    environment:
      LOCAL_INGESTION_URL: http://ingestion-api:8080
      LOCAL_WEB_URL: http://web:8080
volumes:
  verification_data:
networks:
  default:
    internal: true
