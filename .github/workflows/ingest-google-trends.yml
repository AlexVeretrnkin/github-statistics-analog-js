name: Ingest Google Trends

on:
  schedule:
    - cron: '47 6 6 * *'
  workflow_dispatch:

concurrency:
  group: ingest-google-trends
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install and cache collector dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::gtrendsR
            any::dplyr
            any::tidyr
            any::tibble
            any::httr
            any::jsonlite
          cache-version: 1

      - name: Collect Google Trends observations
        working-directory: research/framework-popularity
        run: Rscript jobs/collect_google_trends_ingestion.R

      - name: Authenticate for ingestion publish
        id: publish-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INGESTION_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_INGESTION_AUDIENCE }}

      - name: Publish and commit Google Trends dataset
        working-directory: research/framework-popularity
        env:
          RESEARCH_INGESTION_TOKEN: ${{ steps.publish-auth.outputs.id_token }}
          RESEARCH_INGESTION_URL: ${{ vars.GCP_INGESTION_URL }}
        run: Rscript jobs/publish_google_trends_ingestion.R
