name: Verify isolated Docker bootstrap
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/research-snapshot-validation.test.mjs
      - run: node tools/verify-docker-reproducibility.mjs --no-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-bootstrap-report
          path: output/reproducibility/
