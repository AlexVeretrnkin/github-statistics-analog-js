name: Ingest GitHub stars

on:
  schedule:
    - cron: '23 4 7 * *'
  workflow_dispatch:

concurrency:
  group: ingest-github-stars
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install and cache collector dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::readr
            any::dplyr
            any::lubridate
            any::tibble
          cache-version: 1

      - name: Run star-history unit checks
        working-directory: research/framework-popularity
        run: Rscript tests/test_github_star_history.R

      - name: Collect and reconcile GitHub star history
        working-directory: research/framework-popularity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: Rscript jobs/collect_github_stars_ingestion.R

      - name: Authenticate for ingestion publish
        id: publish-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INGESTION_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_INGESTION_AUDIENCE }}

      - name: Publish and commit GitHub stars dataset
        working-directory: research/framework-popularity
        env:
          RESEARCH_INGESTION_TOKEN: ${{ steps.publish-auth.outputs.id_token }}
          RESEARCH_INGESTION_URL: ${{ vars.GCP_INGESTION_URL }}
        run: Rscript jobs/publish_github_stars_ingestion.R
